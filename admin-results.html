<!DOCTYPE html>
<html>
<head>
  <title>Admin Results</title>

  <style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* BODY */
body {
  background: linear-gradient(135deg, #0f172a, #020617);
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
  padding: 15px 30px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* LOGOS */
.logo-left img,
.logo-right img {
  width: 60px;
  height: 60px;
  object-fit: contain;
  background: white;
  padding: 5px;
  border-radius: 10px;
  transition: 0.3s;
}

.logo-left img:hover,
.logo-right img:hover {
  transform: scale(1.1);
}

/* HEADER TEXT */
.header-titless {
  text-align: center;
  line-height: 1.4;
}

.sub-title {
  font-size: 12px;
  opacity: 0.85;
}

.tagline {
  font-size: 11px;
  color: #00e5ff;
  font-style: italic;
}

/* DOWNLOAD BUTTON */
#downloadPdfBtn {
  padding: 14px 25px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border: none;
  border-radius: 10px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
}

#downloadPdfBtn:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 12px 30px rgba(37, 99, 235, 0.7);
}

/* ADMIN BUTTON */
.admin-section {
  text-align: center;
  margin: 20px 0;
}

.admin-btn {
  display: inline-block;
  padding: 12px 22px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  transition: 0.3s;
  box-shadow: 0 6px 20px rgba(34,197,94,0.4);
}

.admin-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(34,197,94,0.6);
}

/* MAIN CONTAINER */
.containerhgh {
  max-width: 900px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  animation: fadeIn 1s ease;
}

/* TITLE */
.containerhgh h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #00e676;
  font-size: 24px;
}

/* RESULT CARD */
.position {
  background: rgba(255,255,255,0.06);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  transition: 0.3s;
  animation: slideUp 0.6s ease;
}

.position:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* POSITION TITLE */
.position h3 {
  margin-bottom: 15px;
  color: #38bdf8;
  font-size: 18px;
}

/* RESULT TEXT */
.position p {
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 14px;
}

.position p:last-child {
  border-bottom: none;
}

/* ANIMATIONS */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

  </style>
</head>

<body>

<header class="top-header">

  <div class="logo-left">
    <img src="image/futo.jpg">
  </div>

  <div class="header-titless">
    <p class="sub-title">
     FEDERAL UNIVERSITY OF TECHNOLOGY, OWERRI, FUTOMSA
    </p>
    <p class="sub-title">
      MEDICAL ELECTORAL COMMISSION (MEC)
    </p>
    <p class="tagline">
      Secure Online Voting System
    </p>
  </div>

  <div class="logo-right">
    <img src="image/msi.jpg">
  </div>

</header>

<div style="text-align:center; margin:20px;">
  <button id="downloadPdfBtn">
    📄 Download Results as PDF
  </button>
</div>

<div class="admin-section">
  <a href="adminregistration.html" class="admin-btn">
    🔐 Registration page
  </a>
</div>

<div class="containerhgh">
  <h2>Election Results Admin Only</h2>
  <div id="resultttts"></div>
</div>

<div class="admin-section">
  <a href="index.html" class="admin-btn">
    🔐 Logout
  </a>
</div>

<script type="module" src="admin-results.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="download-pdf.js"></script>

</body>
</html>
